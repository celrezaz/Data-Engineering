version: 2

snapshots:
  - name: snapshots_check
    description: "Snapshot de representantes de ventas que captura cambios de equipo comercial a lo largo del tiempo. Genera una fila nueva por cada cambio detectado en sales_team_id"
    columns:
      - name: sk_sales_rep
        data_type: varchar
        description: "Surrogate key del representante en el momento de la captura"
        data_tests:
          - not_null

      - name: name_sales_rep
        data_type: varchar
        description: "Nombre completo del representante de ventas"
        data_tests:
          - not_null

      - name: sales_rep_id
        data_type: varchar
        description: "Identificador del representante de ventas. No es única ya que un representante puede tener varias filas históricas"
        data_tests:
          - not_null

      - name: sales_team_id
        data_type: varchar
        description: "Identificador del equipo comercial al que pertenece el representante en el periodo de vigencia"
        data_tests:
          - not_null

      - name: dbt_scd_id
        data_type: varchar
        description: "Identificador único generado por dbt para cada versión del registro en el snapshot"
        data_tests:
          - unique
          - not_null

      - name: dbt_updated_at
        data_type: timestamp_ntz
        description: "Timestamp de la última actualización del registro en el snapshot"
        data_tests:
          - not_null

      - name: dbt_valid_from
        data_type: timestamp_ntz
        description: "Timestamp de inicio de vigencia del registro. Indica cuándo se detectó el estado actual"
        data_tests:
          - not_null

      - name: dbt_valid_to
        data_type: timestamp_ntz
        description: "Timestamp de fin de vigencia del registro. Null si es el registro activo actual"