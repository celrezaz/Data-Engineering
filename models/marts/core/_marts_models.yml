version: 2

models:

  # ── DIMENSIONES ────────────────────────────────────────────

  - name: dim_cliente
    description: "Dimensión de clientes con información geográfica"
    columns:
      - name: customer_id
        data_type: varchar
        description: "PK del cliente"
        data_tests:
          - unique
          - not_null

      - name: customer_name
        data_type: varchar
        description: "Nombre del cliente"
        data_tests:
          - not_null

      - name: country
        data_type: varchar
        description: "País del cliente"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Germany', 'Poland']

      - name: city
        data_type: varchar
        description: "Ciudad del cliente"
        data_tests:
          - not_null

      - name: latitude
        data_type: number
        description: "Latitud geográfica"

      - name: longitude
        data_type: number
        description: "Longitud geográfica"


  - name: dim_distribuidora
    description: "Dimensión de distribuidoras farmacéuticas"
    columns:
      - name: distributor_id
        data_type: varchar
        description: "PK de la distribuidora"
        data_tests:
          - unique
          - not_null

      - name: distributor
        data_type: varchar
        description: "Nombre de la distribuidora"
        data_tests:
          - not_null


  - name: dim_fecha
    description: "Dimensión de fechas con atributos temporales"
    columns:
      - name: fecha
        data_type: date
        description: "PK - Fecha completa"
        data_tests:
          - unique
          - not_null

      - name: mes_id
        data_type: varchar
        description: "Identificador del mes"
        data_tests:
          - not_null

      - name: year
        data_type: number
        description: "Año"
        data_tests:
          - not_null

      - name: trimestre
        data_type: varchar
        description: "Trimestre (Q1/Q2/Q3/Q4)"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Q1', 'Q2', 'Q3', 'Q4']

      - name: estacion
        data_type: varchar
        description: "Estación del año"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Primavera', 'Verano', 'Otoño', 'Invierno']


  - name: dim_producto
    description: "Dimensión de productos farmacéuticos con SCD tipo 2"
    columns:
      - name: pk_product
        data_type: varchar
        description: "SK surrogate (PK del SCD2)"
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_type: varchar
        description: "NK natural key del producto"
        data_tests:
          - not_null

      - name: product_name
        data_type: varchar
        description: "Nombre del producto"
        data_tests:
          - not_null

      - name: product_class
        data_type: varchar
        description: "Clase del producto"
        data_tests:
          - not_null

      - name: precio_coste
        data_type: number
        description: "Precio de coste"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: precio_venta
        data_type: number
        description: "Precio de venta"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: valid_from
        data_type: date
        description: "Inicio de vigencia del registro"
        data_tests:
          - not_null

      - name: valid_to
        data_type: date
        description: "Fin de vigencia (null = registro activo)"


  - name: dim_repventas
    description: "Dimensión de representantes de ventas con SCD tipo 2"
    columns:
      - name: pk_sales_rep
        data_type: varchar
        description: "SK surrogate (PK del SCD2)"
        data_tests:
          - unique
          - not_null

      - name: sales_rep_id
        data_type: varchar
        description: "NK natural key del representante"
        data_tests:
          - not_null

      - name: name_sales_rep
        data_type: varchar
        description: "Nombre del representante"
        data_tests:
          - not_null

      - name: sales_team
        data_type: varchar
        description: "Equipo comercial"
        data_tests:
          - not_null

      - name: manager
        data_type: varchar
        description: "Manager del representante"
        data_tests:
          - not_null

      - name: valid_from
        data_type: timestamp_ntz
        description: "Inicio de vigencia"
        data_tests:
          - not_null

      - name: valid_to
        data_type: timestamp_ntz
        description: "Fin de vigencia (null = registro activo)"

      - name: is_current
        data_type: boolean
        description: "Indica si es el registro activo del representante"
        data_tests:
          - not_null


  - name: dim_subcanal
    description: "Dimensión de subcanales comerciales"
    columns:
      - name: subchannel_id
        data_type: varchar
        description: "PK del subcanal"
        data_tests:
          - unique
          - not_null

      - name: subchannel
        data_type: varchar
        description: "Nombre del subcanal"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Government', 'Retail', 'Institution', 'Private']

      - name: channel
        data_type: varchar
        description: "Canal al que pertenece el subcanal"
        data_tests:
          - not_null
          - accepted_values:
              values: ['Pharmacy', 'Hospital']


  # ── FACTS ──────────────────────────────────────────────────

  - name: fact_ventas
    description: "Tabla de hechos de ventas farmacéuticas"
    columns:
      - name: linea_venta_id
        data_type: varchar
        description: "PK de la línea de venta"
        data_tests:
          - unique
          - not_null

      - name: venta_id
        data_type: varchar
        description: "Identificador de la venta (agrupa líneas)"
        data_tests:
          - not_null

      - name: pk_product
        data_type: varchar
        description: "FK → dim_producto (SK del SCD2)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_producto')
              field: pk_product

      - name: pk_sales_rep
        data_type: varchar
        description: "FK → dim_repventas (SK del SCD2)"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_repventas')
              field: pk_sales_rep

      - name: customer_id
        data_type: varchar
        description: "FK → dim_cliente"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_cliente')
              field: customer_id

      - name: subchannel_id
        data_type: varchar
        description: "FK → dim_subcanal"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_subcanal')
              field: subchannel_id

      - name: distributor_id
        data_type: varchar
        description: "FK → dim_distribuidora"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_distribuidora')
              field: distributor_id

      - name: fecha
        data_type: date
        description: "FK → dim_fecha"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_fecha')
              field: fecha

      - name: product_id
        data_type: varchar
        description: "NK del producto (para joins sin SCD2)"

      - name: sales_rep_id
        data_type: varchar
        description: "NK del representante (para joins sin SCD2)"

      - name: quantity
        data_type: number
        description: "Unidades vendidas"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: ventas_totales
        data_type: number
        description: "Importe total de ventas"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: beneficio_total
        data_type: number
        description: "Beneficio total (ventas - coste)"
        data_tests:
          - not_null


  - name: fact_objetivos
    description: "Tabla de hechos de objetivos comerciales"
    columns:
      - name: linea_venta_id
        data_type: varchar
        description: "PK del registro de objetivo"
        data_tests:
          - unique
          - not_null

      - name: venta_id
        data_type: varchar
        description: "Identificador de venta asociada"
        data_tests:
          - not_null

      - name: pk_product
        data_type: varchar
        description: "FK → dim_producto"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_producto')
              field: pk_product

      - name: pk_sales_rep
        data_type: varchar
        description: "FK → dim_repventas"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_repventas')
              field: pk_sales_rep

      - name: customer_id
        data_type: varchar
        description: "FK → dim_cliente"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_cliente')
              field: customer_id

      - name: subchannel_id
        data_type: varchar
        description: "FK → dim_subcanal"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_subcanal')
              field: subchannel_id

      - name: distributor_id
        data_type: varchar
        description: "FK → dim_distribuidora"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_distribuidora')
              field: distributor_id

      - name: fecha
        data_type: date
        description: "FK → dim_fecha"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_fecha')
              field: fecha

      - name: product_id
        data_type: varchar
        description: "NK del producto"

      - name: sales_rep_id
        data_type: varchar
        description: "NK del representante"

      - name: quantity
        data_type: number
        description: "Cantidad objetivo"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: ventas_totales
        data_type: number
        description: "Importe objetivo de ventas"
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: beneficio_total
        data_type: number
        description: "Beneficio objetivo"
        data_tests:
          - not_null