sources:

  - name: google_sheet # name of the source 
    schema: google_sheet # this is the schema our raw data lives in
    database: db16_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    config: 
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:

      - name: budget #name of the table
        config: 
          loaded_at_field: _fivetran_synced
        columns:
          - name: _row
          - name: quantity
          - name: month
          - name: product_id
          - name: _fivetran_synced