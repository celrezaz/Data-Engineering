version: 2

models:
  - name: stg_objectives__objetivos
    description: "Vista con los objetivos comerciales mensuales asignados a cada representante de ventas"
    columns:
      - name: objetivo_id
        data_type: varchar
        description: "Identificador único del objetivo comercial"
        tests:
          - unique
          - not_null

      - name: sales_rep_id
        data_type: varchar
        description: "Identificador del representante de ventas asociado al objetivo"
        tests:
          - not_null

      - name: mes_id
        data_type: varchar
        description: "Identificador del mes al que corresponde el objetivo"
        tests:
          - not_null

      - name: objective_sales
        data_type: number
        description: "Importe objetivo de ventas definido para el representante comercial en el periodo. 
                      Puede ser nulo si el representante no tenía objetivo asignado ese mes 
                      (dato no registrado en origen)."

  - name: stg_pharma__canal
    description: "Vista con los canales comerciales utilizados para clasificar las ventas"
    columns:
      - name: channel
        data_type: varchar
        description: "Nombre del canal comercial: pharmacy/hospital"

      - name: channel_id
        data_type: varchar
        description: "Identificador único del canal comercial"
        tests:
          - not_null

  - name: stg_pharma__ciudad
    description: "Vista con información geográfica de ciudades y países asociados"
    columns:
      - name: city
        data_type: varchar
        description: "Nombre de la ciudad"

      - name: city_id
        data_type: varchar
        description: "Identificador único de la ciudad"
        tests:
          - not_null

      - name: country_id
        data_type: varchar
        description: "Identificador del país al que pertenece la ciudad"
        tests:
          - not_null

      - name: country
        data_type: varchar
        description: "Nombre del país asociado a la ciudad: Germany/Poland"

      - name: latitude
        data_type: number
        description: "Latitud geográfica de la ciudad"

      - name: longitude
        data_type: number
        description: "Longitud geográfica de la ciudad"

  - name: stg_pharma__clase
    description: "Vista con la clasificación de productos farmacéuticos"
    columns:
      - name: product_class
        data_type: varchar
        description: "Nombre de la clase o categoría del producto"

      - name: product_class_id
        data_type: varchar
        description: "Identificador único de la clase de producto"
        tests:
          - unique
          - not_null

  - name: stg_pharma__cliente
    description: "Vista con información básica de clientes"
    columns:
      - name: customer_name
        data_type: varchar
        description: "Nombre del cliente"

      - name: customer_id
        data_type: varchar
        description: "Identificador único del cliente"
        tests:
          - unique
          - not_null

      - name: city_id
        data_type: varchar
        description: "Identificador de la ciudad asociada al cliente: Germany/Poland"
        tests:
          - not_null

  - name: stg_pharma__distribuidora
    description: "Vista con las distribuidoras farmacéuticas"
    columns:
      - name: distributor
        data_type: varchar
        description: "Nombre de la distribuidora"

      - name: distributor_id
        data_type: varchar
        description: "Identificador único de la distribuidora"
        tests:
          - unique
          - not_null

  - name: stg_pharma__equipoventas
    description: "Vista con los equipos comerciales y sus responsables"
    columns:
      - name: sales_team
        data_type: varchar
        description: "Nombre del equipo de ventas"

      - name: sales_team_id
        data_type: varchar
        description: "Identificador único del equipo de ventas"
        tests:
          - unique
          - not_null

      - name: manager_id
        data_type: varchar
        description: "Identificador del manager responsable del equipo comercial"
        tests:
          - not_null

  - name: stg_pharma__fecha
    description: "Vista con fechas de ventas y referencia mensual"
    columns:
      - name: fecha
        data_type: date
        description: "Fecha de la venta"
        tests:
          - unique
          - not_null

      - name: mes_id
        data_type: varchar
        description: "Identificador del mes asociado a la fecha"
        tests:
          - not_null

  - name: stg_pharma__manager
    description: "Vista con los managers comerciales"
    columns:
      - name: manager
        data_type: varchar
        description: "Nombre del manager comercial"

      - name: manager_id
        data_type: varchar
        description: "Identificador único del manager comercial"
        tests:
          - unique
          - not_null

  - name: stg_pharma__mes
    description: "Vista mensual"
    columns:
      - name: mes_id
        data_type: varchar
        description: "Identificador único del mes asociado al año"
        tests:
          - unique
          - not_null

      - name: month
        data_type: varchar
        description: "Nombre del mes"

      - name: year
        data_type: number
        description: "Año"

  - name: stg_pharma__pais
    description: "Vista con los países"
    columns:
      - name: country
        data_type: varchar
        description: "Nombre del los país: Germany/Poland"

      - name: country_id
        data_type: varchar
        description: "Identificador único del país"
        tests:
          - unique
          - not_null

  - name: stg_pharma__producto
    description: "Vista con productos farmacéuticos y precios"
    columns:
      - name: product_name
        data_type: varchar
        description: "Nombre comercial del producto farmacéutico"

      - name: product_id
        data_type: varchar
        description: "Identificador único del producto"
        tests:
          - not_null

      - name: product_class_id
        data_type: varchar
        description: "Identificador único de la clase del producto"
        tests:
          - not_null

      - name: precio_coste
        data_type: number
        description: "Precio de coste durante el periodo de vigencia"
        tests:
          - not_null

      - name: precio_venta
        data_type: number
        description: "Precio de venta durante el periodo de vigencia"
        tests:
          - not_null

      - name: valid_from
        data_type: date
        description: "Inicio fecha válida"
        tests:
          - not_null

      - name: valid_to
        data_type: date
        description: "Fin fecha válida"
          

  - name: stg_pharma__repventas
    description: "Vista con representantes comerciales y su organización"
    columns:
      - name: sales_rep_id
        data_type: varchar
        description: "Identificador único del representante de ventas"
        tests:
          - unique
          - not_null

      - name: sales_team_id
        data_type: varchar
        description: "Identificador único del equipo comercial al que pertenece el representante"
        tests:
          - not_null

      - name: name_sales_rep
        data_type: varchar
        description: "Nombre completo del representante de ventas"

  - name: stg_pharma__subcanal
    description: "Vistsa con los subcanales comerciales asociados a cada canal principal"
    columns:
      - name: subchannel
        data_type: varchar
        description: "Nombre del subcanal comercial"

      - name: subchannel_id
        data_type: varchar
        description: "Identificador único del subcanal comercial"
        tests:
          - unique
          - not_null

      - name: channel_id
        data_type: varchar
        description: "Identificador único del canal comercial"
        tests:
          - not_null

  - name: stg_pharma__ventas
    description: "Vista con el detalle transaccional de ventas farmacéuticas"
    columns:
      - name: linea_venta_id
        data_type: varchar
        description: "Identificador único de la línea de venta"
        tests:
          - unique
          - not_null

      - name: venta_id
        data_type: varchar
        description: "Identificador único de la venta"
        tests:
          - not_null

      - name: distributor_id
        data_type: varchar
        description: "Identificador único de la distribuidora"
        tests:
          - not_null

      - name: product_id
        data_type: varchar
        description: "Identificador único del producto"
        tests:
          - not_null


      - name: subchannel_id
        data_type: varchar
        description: "Identificador único del subcanal comercial"
        tests:
          - not_null

      - name: customer_id
        data_type: varchar
        description: "Identificador del cliente asociado a la venta"
        tests:
          - not_null

      - name: fecha
        data_type: date
        description: "Fecha en la que se realizó la venta"
        tests:
          - not_null

      - name: sales_rep_id
        data_type: varchar
        description: "Identificador del representante comercial responsable de la venta"
        tests:
          - not_null

      - name: quantity
        data_type: number
        description: "Cantidad de unidades vendidas en la línea de venta"
        tests:
          - not_null